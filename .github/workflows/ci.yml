# codegen 仓库 CI
#
# build / smoke jobs：生成器自身只产出源码文本，构建与冒烟不依赖 framework 任何模块。
# e2e-compile job：把生成物落进一个 archetype 生成的真实业务工程里，在真实框架依赖树下
#   `mvn test-compile`——这一步替代了原先由独立仓 sample-app 的 CI 承担的
#   「生成的代码能否在真实框架下编译」职责（见 docs/MIGRATION_NOTES.md D5）。
#   它 checkout 的是 framework（生成物真正要编译对的那个依赖），不是外部夹具仓。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建与测试
        run: mvn -B clean verify

      - name: 冒烟：示例 spec 能生成全部产物
        run: |
          set -e
          java -jar target/codegen.jar examples/project.yaml --out /tmp/gen
          for f in \
            /tmp/gen/src/main/java/com/example/demo/project/entity/ProjectEntity.java \
            /tmp/gen/src/main/java/com/example/demo/project/controller/ProjectController.java \
            /tmp/gen/src/main/resources/db/schema-biz_project.sql \
            /tmp/gen/src/main/resources/db/menu-biz_project.sql \
            /tmp/gen/frontend/src/views/project/index.vue ; do
            [ -f "$f" ] || { echo "::error::缺少产物 $f"; exit 1; }
          done
          echo "  ✓ 全部产物已生成"

      - name: 冒烟：生成的 DDL 能在 MySQL 5.7 上执行
        run: |
          set -e
          docker run -d --name cg57 -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=cg \
            mysql:5.7 --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
          # 就绪探针必须是「真正要做的那件事」。
          # 原先用的是 `docker exec cg57 mysqladmin ping`（不带 -h，走 unix socket）。
          # MySQL 5.7 的 entrypoint 初始化期间会先起一个临时服务器，它带
          # --skip-networking，只监听 socket。于是 socket 上的 ping 立刻成功，
          # 循环第 2 轮就跳出，紧接着的查询拿到 ERROR 1045 Access denied
          # —— 容器启动 4 秒即失败，而 5.7 完整初始化要 20~30 秒。
          #
          # 注意 docs/docker-compose.test.yml 里的 `mysqladmin ping -h 127.0.0.1`
          # 并没有这个问题：临时服务器不监听 TCP，探针会如实失败。
          # 出问题的是「走 socket 的 ping」，不是 ping 本身。
          ready=
          for i in $(seq 1 60); do
            if docker exec cg57 mysql -uroot -proot -N -B cg -e 'SELECT 1' >/dev/null 2>&1; then
              ready=yes; break
            fi
            sleep 2
          done
          [ -n "$ready" ] || { echo "::error::MySQL 5.7 在 120 秒内未就绪"; docker logs cg57 | tail -30; exit 1; }
          docker cp /tmp/gen/src/main/resources/db/schema-biz_project.sql cg57:/tmp/s.sql
          docker exec cg57 sh -c 'mysql -uroot -proot --default-character-set=utf8mb4 cg < /tmp/s.sql'
          # 值断言而非计数：字符集损坏时计数依然正确（CLAUDE.md 3.6）
          got=$(docker exec cg57 mysql -uroot -proot --default-character-set=utf8mb4 -N -B cg -e \
            "SELECT column_comment FROM information_schema.columns \
             WHERE table_schema='cg' AND table_name='biz_project' AND column_name='project_name';")
          [ "$got" = "项目名称" ] || { echo "::error::中文注释损坏: $got"; exit 1; }
          echo "  ✓ DDL 在 MySQL 5.7 上执行成功，中文注释完好"

      - name: 清理
        if: always()
        run: docker rm -f cg57 || true

  e2e-compile:
    name: 生成物在真实框架依赖树下编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: codegen
      # 生成物真正要编译对的依赖就是 framework 本身——checkout 它、用它现构建的
      # archetype 生成工程，版本天然对齐，不依赖 Central 上已发布的版本。
      - uses: actions/checkout@v4
        with:
          repository: describeadmin/framework
          path: framework

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 framework 与 archetype 到本地仓库
        run: mvn -B -f framework/pom.xml install -DskipTests -Dgpg.skip=true

      - name: 读取框架版本
        id: fv
        run: echo "v=$(mvn -B -q -f framework/pom.xml -DforceStdout -Dexpression=project.version help:evaluate)" >> "$GITHUB_OUTPUT"

      - name: 构建 codegen.jar
        run: mvn -B -f codegen/pom.xml -q clean package -DskipTests

      - name: 用 archetype 生成业务工程，注入 project 模块
        run: |
          set -e
          mkdir -p /tmp/e2e && cd /tmp/e2e
          mvn -B org.apache.maven.plugins:maven-archetype-plugin:3.4.1:generate \
            -DarchetypeGroupId=io.github.describeadmin \
            -DarchetypeArtifactId=describeadmin-archetype \
            -DarchetypeVersion=${{ steps.fv.outputs.v }} \
            -DgroupId=com.example.demo -DartifactId=e2e-app -Dversion=1.0.0-SNAPSHOT \
            -Dpackage=com.example.demo -DdbPort=3306 -DinteractiveMode=false
          # examples/project.yaml 的 basePackage 就是 com.example.demo
          java -jar "$GITHUB_WORKSPACE/codegen/target/codegen.jar" \
            "$GITHUB_WORKSPACE/codegen/examples/project.yaml" \
            --out /tmp/e2e/e2e-app --frontend-out /tmp/e2e/fe

      - name: 在真实框架依赖树下编译
        run: mvn -B -f /tmp/e2e/e2e-app/pom.xml test-compile
